<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM — Явные границы (тест Canny)</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; background: #fafafa; color: #111; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #37474f; color: #fff; border-bottom: 2px solid #263238; }
    .header h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .header-actions { display: flex; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; min-height: 36px; }
    .btn-primary { background: #1565c0; color: #fff; border: 2px solid #0d47a1; }
    .btn-outline { background: #fff; color: #37474f; border: 2px solid #546e7a; }
    .main { max-width: 700px; margin: 24px auto; padding: 0 24px; }
    .card { background: #fff; border: 2px solid #546e7a; border-radius: 4px; margin-bottom: 24px; padding: 20px; }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: #263238; }
    .form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .label { min-width: 100px; font-size: 13px; color: #37474f; }
    .input-text { min-width: 150px; min-height: 28px; max-height: 80px; padding: 8px 12px; border: 2px solid #37474f; border-radius: 4px; font-size: 14px; background: #fff; }
    .input-text:focus { outline: none; border-color: #1565c0; }
    textarea.input-text { min-height: 60px; resize: vertical; border: 2px solid #37474f; }
    /* Темы: форма и поля различаются (по умолчанию уже явные границы) */
    body.theme-dark { background: #0d1117; color: #eee; }
    body.theme-dark .card { background: #1a2332; border-color: #2d3a4d; }
    body.theme-dark .input-text { background: #252d3a; border-color: #4a5568; color: #eee; }
    body.theme-dark .label { color: #cbd5e0; }
    body.theme-green { background: #f0f7f0; }
    body.theme-green .card { background: #e8f5e9; border-color: #a5d6a7; }
    body.theme-green .input-text { background: #fff; border-color: #81c784; }
    body.theme-green .header { background: #1b5e20; border-bottom-color: #0d3d0d; }
    body.theme-green .btn-primary { background: #2e7d32; border-color: #1b5e20; }
    body.theme-green .input-text:focus { border-color: #2e7d32; }
  </style>
</head>
<body>
  <script>(function(){ var p = new URLSearchParams(location.search); var t = p.get('theme'); if (t) document.body.classList.add('theme-' + t); })();</script>
  <header class="header">
    <h1>Форма с явными границами</h1>
    <div class="header-actions">
      <button type="button" class="btn btn-outline">Cancel</button>
      <button type="button" class="btn btn-primary">Save</button>
    </div>
  </header>

  <main class="main">
    <div class="card" data-form="main">
      <h2 class="card-title">Поля для теста контуров (2px border)</h2>
      <div class="form-row">
        <label class="label" for="t1-name">Имя</label>
        <input type="text" id="t1-name" class="input-text" placeholder="Введите имя" data-input-type="text">
      </div>
      <div class="form-row">
        <label class="label" for="t1-email">Email</label>
        <input type="email" id="t1-email" class="input-text" placeholder="email@example.com" data-input-type="email">
      </div>
      <div class="form-row">
        <label class="label" for="t1-notes">Заметки</label>
        <textarea id="t1-notes" class="input-text" rows="2" data-input-type="textarea"></textarea>
      </div>
    </div>
  </main>
</body>
</html>
