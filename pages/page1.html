<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 24px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.header {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 16px;
}

.section {
    border: 1px solid #ddd;
    margin-bottom: 12px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.row:last-child {
    border-bottom: none;
}

.button {
    padding: 6px 10px;
    border: 1px solid #333;
    background: none;
}
</style>
</head>

<body>
<div class="container">

    <div class="header">Orders</div>

    <div class="section">

        <div class="row">
            <div>#1001</div>
            <div>John Smith</div>
            <div>Pending</div>
            <div><button class="button">Open</button></div>
        </div>

        <div class="row">
            <div>#1002</div>
            <div>Anna Brown</div>
            <div>Completed</div>
            <div><button class="button">Open</button></div>
        </div>

    </div>

</div>
</body>
</html>
