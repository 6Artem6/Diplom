<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <div class="row g-3">
      <div class="col-4">
        <div class="card p-3">
          <h6>Title A</h6>
          <p>Text A</p>
        </div>
      </div>
      <div class="col-4">
        <div class="card p-3">
          <h6>Title B</h6>
          <p>Text B</p>
        </div>
      </div>
      <div class="col-4">
        <div class="card p-3">
          <h6>Title C</h6>
          <p>Text C</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
