<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details View – BPG Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .form-card { border: 2px solid #dee2e6; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { border-bottom: 2px solid #0d6efd; padding-bottom: .5rem; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">Edit Item</h1>

    <div class="form-card card p-4">
      <form>
        <div class="mb-3">
          <label class="form-label" for="name">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Enter name">
        </div>
        <div class="mb-3">
          <label class="form-label" for="desc">Description</label>
          <textarea class="form-control" id="desc" rows="4" placeholder="Enter description"></textarea>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="active">
          <label class="form-check-label" for="active">Active</label>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-outline-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
