<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Product Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <style>
        body {
            background: #f0f0f0;
        }
        .details-wrapper {
            border: 4px solid #000;
            border-radius: 16px;
            padding: 32px;
            background: #fff;
            margin-top: 40px;
        }
        .details-image {
            width: 100%;
            height: 240px;
            background: #ccc;
            border: 3px solid #000;
            margin-bottom: 24px;
        }
        .buy-button {
            border: 3px solid #000;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="details-wrapper">
        <div class="details-image"></div>

        <h1>iPhone 14</h1>
        <p class="fs-4">$799</p>

        <p>
            Apple smartphone with A15 Bionic chip, OLED display and dual-camera system.
        </p>

        <button class="btn btn-success buy-button mt-3">
            Buy now
        </button>
    </div>
</div>

</body>
</html>
