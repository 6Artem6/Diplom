<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Body Baseline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <p class="fw-normal">
      This is a normal body paragraph. It spans multiple lines to simulate real text content.
    </p>
    <p class="fw-semibold">
      This is still body text, just semibold. It must not be classified as a header.
    </p>
    <p class="fw-bold">
      This is bold body text. Same size, different weight.
    </p>
  </div>
</body>
</html>
