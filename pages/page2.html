<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 24px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
}

.header {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 16px;
}

.block {
    border: 1px solid #ddd;
    padding: 12px;
    margin-bottom: 12px;
}

.label {
    font-weight: bold;
    margin-bottom: 6px;
}

.button {
    padding: 6px 10px;
    border: 1px solid #333;
    background: none;
    margin-right: 8px;
}
</style>
</head>

<body>
<div class="container">

    <div class="header">Order #1001</div>

    <div class="block">
        <div class="label">Customer</div>
        <div>John Smith</div>
        <div>john@example.com</div>
    </div>

    <div class="block">
        <div class="label">Product</div>
        <div>Laptop Pro 15</div>
        <div>Qty: 1</div>
        <div>Price: $1200</div>
    </div>

    <div>
        <button class="button">Approve</button>
        <button class="button">Cancel</button>
    </div>

</div>
</body>
</html>
