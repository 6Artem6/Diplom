<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paragraph Merge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">
  <div class="container py-4">
    <p>
      First line of a paragraph that continues naturally.
    </p>
    <p>
      Second line of the same paragraph. Same font size, same alignment.
    </p>
    <p>
      Third line, should be merged into the same body block.
    </p>
  </div>
</body>
</html>
