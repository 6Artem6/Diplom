<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Без рамки, только placeholder</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f5; color: #1a1a1a; }
    .card { max-width: 440px; margin: 24px auto; padding: 20px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .form-row { margin-bottom: 14px; }
    .input-text { width: 100%; padding: 10px 12px; border: none; border-radius: 6px; font-size: 14px; min-height: 40px; background: #f8f9fa; }
    .input-text:focus { outline: none; box-shadow: inset 0 0 0 1px #ddd; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; background: #3498db; color: #fff; border: none; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Поля без рамки</h2>
    <div class="form-row">
      <input type="text" class="input-text" placeholder="Введите имя">
    </div>
    <div class="form-row">
      <input type="text" class="input-text" placeholder="email@example.com">
    </div>
    <div class="form-row">
      <input type="text" class="input-text" placeholder="Пароль">
    </div>
    <button type="button" class="btn">Войти</button>
  </div>
</body>
</html>
