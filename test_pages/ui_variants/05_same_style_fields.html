<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одинаковые поля в одной карточке</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #f0f2f5; color: #1a1a1a; }
    .card { max-width: 400px; margin: 24px auto; padding: 20px; background: #fff; border: 1px solid #dfe6e9; border-radius: 8px; }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .form-row { margin-bottom: 12px; }
    .input-text { width: 100%; padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 14px; background: #fff; min-height: 36px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; background: #3498db; color: #fff; border: none; margin-top: 12px; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Три одинаковых поля</h2>
    <div class="form-row">
      <input type="text" class="input-text" placeholder="Поле 1">
    </div>
    <div class="form-row">
      <input type="text" class="input-text" placeholder="Поле 2">
    </div>
    <div class="form-row">
      <input type="text" class="input-text" placeholder="Поле 3">
    </div>
    <button type="button" class="btn">Отправить</button>
  </div>
</body>
</html>
