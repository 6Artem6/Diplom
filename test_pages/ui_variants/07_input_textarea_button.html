<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Input, textarea, button, outline-button</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #f0f2f5; color: #1a1a1a; }
    .card { max-width: 480px; margin: 24px auto; padding: 20px; background: #fff; border: 1px solid #dfe6e9; border-radius: 8px; }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .form-row { margin-bottom: 14px; }
    .label { display: block; margin-bottom: 6px; font-size: 13px; color: #2c3e50; }
    .input-text { width: 100%; padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 14px; background: #fff; min-height: 36px; }
    textarea.input-text { min-height: 80px; resize: vertical; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; min-height: 36px; }
    .btn-primary { background: #3498db; color: #fff; border: 1px solid #2980b9; }
    .btn-outline { background: transparent; color: #2c3e50; border: 1px solid #95a5a6; }
    .actions { display: flex; gap: 10px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Форма</h2>
    <div class="form-row">
      <label class="label" for="name">Имя</label>
      <input type="text" id="name" class="input-text" placeholder="Введите имя">
    </div>
    <div class="form-row">
      <label class="label" for="msg">Сообщение</label>
      <textarea id="msg" class="input-text" rows="4" placeholder="Текст сообщения"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-outline">Отмена</button>
      <button type="button" class="btn btn-primary">Отправить</button>
    </div>
  </div>
</body>
</html>
