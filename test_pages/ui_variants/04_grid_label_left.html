<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сетка полей — label слева</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #f0f2f5; color: #1a1a1a; }
    .card { max-width: 600px; margin: 24px auto; padding: 20px; background: #fff; border: 1px solid #dfe6e9; border-radius: 8px; }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .form-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .label { min-width: 100px; font-size: 13px; color: #2c3e50; }
    .input-text { flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #bdc3c7; border-radius: 6px; font-size: 14px; background: #fff; min-height: 36px; }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; background: #3498db; color: #fff; border: none; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Редактирование</h2>
    <div class="form-row">
      <label class="label" for="x">Имя</label>
      <input type="text" id="x" class="input-text" placeholder="Введите имя">
    </div>
    <div class="form-row">
      <label class="label" for="y">Email</label>
      <input type="text" id="y" class="input-text" placeholder="email@example.com">
    </div>
    <div class="form-row">
      <label class="label" for="z">Телефон</label>
      <input type="text" id="z" class="input-text" placeholder="+7 …">
    </div>
    <button type="button" class="btn">Сохранить</button>
  </div>
</body>
</html>
