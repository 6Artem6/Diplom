<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Варианты input — цвет и толщина рамки</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #f5f5f5; color: #1a1a1a; }
    .card { max-width: 480px; margin: 24px auto; padding: 20px; background: #f3e5f5; border: 1px solid #ce93d8; border-radius: 8px; }
    .card-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
    .form-row { margin-bottom: 14px; }
    .label { display: block; margin-bottom: 4px; font-size: 12px; color: #666; }
    .input-text { width: 100%; padding: 8px 12px; border-radius: 6px; font-size: 14px; min-height: 36px; }
    .input-white { background: #fff; border: 1px solid #bdc3c7; }
    .input-white-2px { background: #fff; border: 2px solid #2c3e50; }
    .input-gray { background: #ecf0f1; border: 1px solid #95a5a6; }
    .input-blue { background: #ebf5fb; border: 1px solid #3498db; }
    .input-no-border { background: #f8f9fa; border: none; outline: none; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); }
    .btn { padding: 8px 16px; border-radius: 6px; font-size: 14px; background: #3498db; color: #fff; border: none; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="card-title">Варианты полей</h2>
    <div class="form-row">
      <label class="label">Белый, 1px</label>
      <input type="text" class="input-text input-white" placeholder="Белый 1px">
    </div>
    <div class="form-row">
      <label class="label">Белый, 2px</label>
      <input type="text" class="input-text input-white-2px" placeholder="Белый 2px">
    </div>
    <div class="form-row">
      <label class="label">Серый</label>
      <input type="text" class="input-text input-gray" placeholder="Серый фон">
    </div>
    <div class="form-row">
      <label class="label">Синий</label>
      <input type="text" class="input-text input-blue" placeholder="Синяя рамка">
    </div>
    <div class="form-row">
      <label class="label">Без рамки</label>
      <input type="text" class="input-text input-no-border" placeholder="Без border">
    </div>
    <button type="button" class="btn">Сохранить</button>
  </div>
</body>
</html>
