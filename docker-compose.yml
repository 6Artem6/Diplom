services:
  bpg_service:
    build:
      context: .
      dockerfile: src/Dockerfile
      args:
        DISABLE_PADDLEOCR: "1"   # "0" on Linux amd64, "1" on Mac/arm64
    container_name: bpg_construction_service
    env_file:
      - .env
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data  # For screenshots
      - ./datasets:/app/datasets  # For datasets
      - ./debug:/app/debug  # For visualization PNGs
      - ./models:/app/models      # All ML models cache (persistent)
      - ./scripts:/app/scripts  # For scripts
    environment:
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HF_TOKEN=${HF_TOKEN}
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - TORCH_HOME=/app/models/torch
      - TRANSFORMERS_CACHE=/app/models/transformers
      - HF_HOME=/app/models/huggingface
      - YOLO_CACHE_DIR=/app/models/yolo
      - UI_YOLO_MODEL_PATH=/app/models/yolo/ui-elements-detection.pt
      - DETECTION_CONFIDENCE_THRESHOLD=0.15
      - CROSS_VIEW_SIMILARITY_THRESHOLD=0.78
      - GUI_ANALYSIS_BACKEND=flow   # yolo_clip | pix2struct | layoutlmv3 | flow
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - TORCH_OFFLINE=1
      - YOLO_OFFLINE=1
      - DISABLE_PADDLEOCR=1
      - PADDLE_OCR_SERVICE_URL=http://paddleocr_service:8000
      - PADDLEOCR_OFFLINE=1
      - PADDLE_OFFLINE=1
    networks:
      - internal_net
    stdin_open: true
    tty: true

  paddleocr_service:
    build:
      context: paddleocr_service
      dockerfile: Dockerfile
    image: paddleocr-service
    container_name: paddleocr_service
    platform: linux/amd64
    ports:
      - "8002:8000"
    environment:
      - PADDLEOCR_OFFLINE=1
      - PADDLE_OFFLINE=1
    networks:
      - internal_net

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  internal_net:
    driver: bridge

volumes:
  qdrant_data:
  ml_models_cache:  # Persistent cache for ML models (YOLO, CLIP, etc.)
